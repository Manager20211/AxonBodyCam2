name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AXON-BodyCam
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AXON-BodyCam
          path: build/libs

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: build/libs/*.jar
          generate_release_notes: true
