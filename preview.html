<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON BODY CAM Watermark Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            position: relative;
            pointer-events: none;
        }

        /* 游戏覆盖层 */
        .camera-view {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: transparent;
            overflow: hidden;
        }

        /* 叠加层 - 右上角水印 */
        .watermark {
            position: absolute;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-family: 'Source Sans Pro Semibold', 'Segoe UI', sans-serif;
            z-index: 10;
        }

        .watermark-text {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .watermark-line {
            color: #ffffff;
            text-shadow:
                1px 1px 2px rgba(0, 0, 0, 0.9),
                -1px -1px 2px rgba(0, 0, 0, 0.9),
                1px -1px 2px rgba(0, 0, 0, 0.9),
                -1px 1px 2px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .timestamp {
            font-size: 16px;
            font-weight: 600;
        }

        .device-id {
            font-size: 15px;
            font-weight: 600;
        }

        .axon-delta {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 3px rgba(236, 217, 37, 0.6));
        }

        /* 底部信息栏 */
        .info-bar {
            position: absolute;
            bottom: 18px;
            left: 18px;
            color: #888;
            font-size: 11px;
            font-family: 'Source Sans Pro', sans-serif;
        }

        /* 录制指示器 */
        .rec-indicator {
            position: absolute;
            top: 14px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff3333;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            background: #ff3333;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 十字准星 */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            mix-blend-mode: screen;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }

        .crosshair::before {
            width: 20px;
            height: 1px;
            left: -10px;
            top: 0;
        }

        .crosshair::after {
            width: 1px;
            height: 20px;
            left: 0;
            top: -10px;
        }
    </style>
</head>

    <script>
        // 实时更新时间戳
        function updateTimestamp() {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');

            // 获取时区偏移
            const offset = -now.getTimezoneOffset();
            const sign = offset >= 0 ? '+' : '-';
            const absOffset = Math.abs(offset);
            const tzHours = String(Math.floor(absOffset / 60)).padStart(2, '0');
            const tzMinutes = String(absOffset % 60).padStart(2, '0');

            const timestamp =
                `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ` +
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ` +
                `${sign}${tzHours}${tzMinutes}`;

            document.getElementById('timestamp').textContent = timestamp;
        }

        // 初始化 + 每秒更新
        updateTimestamp();
        setInterval(updateTimestamp, 1000);
    </script>
